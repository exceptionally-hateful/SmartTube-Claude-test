name: Build Debug APK

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          submodules: recursive

      - name: Use patched MediaServiceCore
        run: |
          git -C MediaServiceCore fetch origin
          git -C MediaServiceCore checkout ae7ded9d1da54f63ee06cc9017f3392f7d6f63d9
          cp patches/LoungeService.java MediaServiceCore/youtubeapi/src/main/java/com/liskovsoft/youtubeapi/lounge/LoungeService.java

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleStbetaDebug

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SmartTube_universal
          path: ./smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk
          if-no-files-found: error

      - name: Check APK is signed
        run: |
          APK=$(ls ./smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk)
          "$(ls -d $ANDROID_HOME/build-tools/*/apksigner | tail -n 1)" verify --verbose "$APK"

      - name: Publish APK to a public release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${{ github.run_number }}" ./smarttubetv/build/outputs/apk/stbeta/debug/*_universal.apk --repo "${{ github.repository }}" --title "Test build ${{ github.run_number }}" --prerelease
